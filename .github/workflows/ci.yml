name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests and offline demo (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Offline unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: Runbook retrieval evaluation
        run: python runbook.py evaluate
      - name: Offline pipeline demo (normal run, rerun, late event, quality failure, reprocess)
        run: python pipeline.py demo
      - name: Install optional BigQuery client
        run: pip install -r requirements-gcp.txt
      - name: BigQuery contract tests (mocked client, no GCP credentials)
        run: python -m unittest tests.test_bigquery_contract -v

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  dataform:
    name: Dataform compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npx --yes @dataform/cli@3.1.3 compile dataform --default-database=ci-compile-only
